<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Taskly — To-Do & Notes</title>
  <link rel="stylesheet" href="todolist.css" />
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body>

  <div class="app-wrapper">
    <!-- Header -->
    <header class="app-header">
      <div class="brand">
        <span class="brand-icon">✅</span>
        <h1 class="brand-name">Taskly</h1>
      </div>
      <span class="date-display" id="dateDisplay"></span>
    </header>

    <!-- Tabs -->
    <nav class="tabs">
      <button class="tab-btn active" data-tab="todos">
        <span class="tab-icon">📋</span> To-Do
      </button>
      <button class="tab-btn" data-tab="notes">
        <span class="tab-icon">📝</span> Notes
      </button>
    </nav>

    <!-- ── TO-DO TAB ── -->
    <section class="tab-panel active" id="tab-todos">
      <!-- Filter bar -->
      <div class="filter-bar">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="active">Active</button>
        <button class="filter-btn" data-filter="completed">Completed</button>
      </div>

      <!-- Add task input -->
      <div class="input-row">
        <input
          type="text"
          id="taskInput"
          placeholder="Add a new task…"
          autocomplete="off"
        />
        <button id="addTaskBtn" class="btn-primary" aria-label="Add task">＋</button>
      </div>

      <!-- Task list -->
      <ul id="taskList" class="task-list"></ul>

      <!-- Footer stats -->
      <div class="todo-footer">
        <span id="taskCount"></span>
        <button id="clearCompletedBtn" class="btn-ghost">Clear completed</button>
      </div>
    </section>

    <!-- ── NOTES TAB ── -->
    <section class="tab-panel" id="tab-notes">
      <!-- Add note form -->
      <div class="note-form">
        <input
          type="text"
          id="noteTitleInput"
          placeholder="Note title…"
          autocomplete="off"
        />
        <textarea
          id="noteBodyInput"
          placeholder="Write your note here…"
          rows="4"
        ></textarea>
        <button id="addNoteBtn" class="btn-primary wide">Add Note</button>
      </div>

      <!-- Notes grid -->
      <div id="noteList" class="note-list"></div>

      <p class="empty-msg" id="noNotesMsg" style="display:none">
        No notes yet — add one above!
      </p>
    </section>
  </div>

  <!-- Edit Task Modal -->
  <div class="modal-overlay" id="editModal" role="dialog" aria-modal="true" aria-label="Edit task" style="display:none">
    <div class="modal">
      <h2>Edit Task</h2>
      <input type="text" id="editTaskInput" placeholder="Task text…" />
      <div class="modal-actions">
        <button id="saveEditBtn" class="btn-primary">Save</button>
        <button id="cancelEditBtn" class="btn-ghost">Cancel</button>
      </div>
    </div>
  </div>

  <!-- Edit Note Modal -->
  <div class="modal-overlay" id="editNoteModal" role="dialog" aria-modal="true" aria-label="Edit note" style="display:none">
    <div class="modal">
      <h2>Edit Note</h2>
      <input type="text" id="editNoteTitleInput" placeholder="Title…" />
      <textarea id="editNoteBodyInput" rows="5" placeholder="Note body…"></textarea>
      <div class="modal-actions">
        <button id="saveNoteEditBtn" class="btn-primary">Save</button>
        <button id="cancelNoteEditBtn" class="btn-ghost">Cancel</button>
      </div>
    </div>
  </div>

  <script src="todolist.js"></script>
</body>
</html>
